    - heading "Yedek Parça" [level=1] [ref=f31e247]
    - paragraph [ref=f31e248]: Yedek parça, araçların üretimi yapıldıktan sonra ihtiyaç duyulan malzemelerdir. Otomotiv satış sonrası ürünleri diye tabir edilen oto yedek parça, bir aracı oluşturan parçaların bütünüdür. Her arabada on binlerce yedek parça bulunmaktadır. Hal böyle olunca aracınızda meydana gelen arızalarda yada bakım ihtiyaçlarında bu malzemelere ihtiyaç duymaktayız. Yedekparca.com.tr olarak bu ihtiyaçlarınızı gidermek için internet üzerinden oto yedek parça satışı yapıyoruz. OTOFAST OTOMOTİV SAN. TİC. LTD. ŞTİ. iştiraki olan web sitemiz ile otomotiv yedek parça pazarının %95'ine hitap ediyoruz. Bu sayede siz değerli müşterilerimizin ihtiyaçlarını büyük ölçüde karşılamaktayız. 250 binin üzerinde araç parçası internet sitemizde bulunmaktadır.
    - paragraph [ref=f31e249]:
      - text: E-ticaret pazarında güven temelli olarak yürütülen ve hızlı bir şekilde ihtiyacı karşılamaya dönük çalışmalarımız her gün devam etmektedir. İnternet sitemizden 7 gün 24 saat esasına dayalı olarak alışveriş yapabilirsiniz. Hafta sonları kargo firmalarının çalışma sistemine göre gönderim yapmaktayız. Genel itibariyle ihtiyacınız olan doğru parçaya şase sorgulaması yaparak ulaşıyoruz. İster bakım ihtiyaçlarınız için isterseniz arıza durumları için oto yedek parça satın alımı yapabilirsiniz. Firmamızın yedekparca.com.tr sitemize eklediği başlıca
