    - heading "Oto Yedek Parça Fiyatları" [level=3] [ref=f31e303]
    - paragraph [ref=f31e304]: Ürünlerimizin stok ve fiyatları günlük olarak güncellenmektedir. Bundan dolayı her zaman güncel stok ve fiyat bilgisine ulaşmış oluyorsunuz. Oto yedek parça fiyatları, istediğiniz ürünün markasına göre değişkenlik göstermektedir. Burada fiyatı etkileyen tek etken marka değildir. Yedek parça için binlerce seçenek vardır. Bunlar içerisinde almak istediğiniz ürünler de farklılık gösterebilir. Her kategorideki ürünün fiyatı farklı olduğu için her markada da farklılıklar vardır.
    - heading "Araba Yedek Parça" [level=3] [ref=f31e305]
    - paragraph [ref=f31e306]: Bir arabada ortalama yirmi bin civarı araba yedek parça bulunmaktadır. Montaj esnasında bu kadar farklı ürünün bir araya getirilmesi ile birlikte aracınız yürür vaziyete gelir. Her parçanın bir ömrü olduğu için zamanla bu parçalar aşınmaktadır. Yaşlanmaya bağlı olarak işlevsiz duruma gelebilir. Kullanıma bağlı olarak etkilendiği için her araçta bu ömür farkıdır. Zamanında yapılan bakımlar, arabanın ömrünü uzatır. Araba yedek parça ihtiyaçlarınız için doğru adrestesiniz.
    - heading "Orijinal Yedek Parça" [level=3] [ref=f31e307]
    - paragraph [ref=f31e308]: Arabalar üretildiklerinde montaj işlemlerine tabi tutulurlar. İlk montaj esnasında aracın fabrika çıkışında mevcutta üzerinde takılı olarak satışa çıkan her parça orijinal yedek parça olarak tanımlanır. Araba üreticileri, piyasaya araba verirken araçtaki yüzlerce kategoriyi teşkil eden parçalar için yedek parça üreticileri ile anlaşma yaparlar. Bu anlaşmalar sonucunda hangi firma ile anlaşma yaptılarsa o markanın ürünü aracın orijinal ürünü olarak piyasaya çıkar. Sıfır arabalar da otomobilde takılı parçalara bakarak hangi ürünü hangi marka üretmiş buna ulaşabilirsiniz.
    - heading "Şase No İle Parça Sorgulama" [level=3] [ref=f31e309]
    - paragraph [ref=f31e310]: Şase no ile parça sorgulama, aracınıza %100 uyumlu yedek parçayı bulmak için yapılan işlemdir. Aracınızdaki binlerce parçayı, şase programları aracılığıyla görebiliyoruz. Aracınıza ait ruhsatta yer alan ve yeni nesil araçlarda 17 haneli olan bu sayı ve harf dizilimi sayesinde aracınızın bir nevi kimliği ortaya çıkar. Benzersiz olan bu dizilime şase numarası adı verilir. Şaseden parça sorgulama, hata ihtimalini ortadan kaldırmak içindir. Araç üreticileri şase numaraları ile bu araca ait olan otomobil yedek parça ürünlerini listeler. Açılan ekranlarda aracınızdaki parçaların listesi gözükmektedir. OEM kodu denilen orijinal parça numarası ile sorgulama yaptığınız arabaya ait parçalara ulaşılmaktadır. OEM kodları ile stok kontrolü yapılarak ürünlerin stok ve fiyat sorgulaması yapılır. Şase numaraları gizli değildir, birçok arabanın ön camında görünür halde bulunur. En hızlı ve doğru parça bulma yöntemi olduğu için tercih edilmektedir. Ekibimiz, müşterilerimiz için bu yöntem ile parça kontrolü yapmaktadır.
    - heading "Yedek Parça Bulucu" [level=4] [ref=f31e311]
    - paragraph [ref=f31e312]: "Yedek parça bulmak teknik bilgi isteyen bir işlemdir. Firmamız, müşterilerimiz için bu bilgiyi sitemiz üzerinden ücretsiz olarak sizlere sunmaktadır. Arabanıza ait teknik özellikleri sitemizden arama yaparak istediğiniz parçaya ulaşabilirsiniz. 6 aşamalı olan uygulamamız şunları kapsamaktadır:"
    - list [ref=f31e313]:
      - listitem [ref=f31e314]: Marka
      - listitem [ref=f31e315]: Model
      - listitem [ref=f31e316]: Kasa
      - listitem [ref=f31e317]: Yıl
      - listitem [ref=f31e318]: Motor
      - listitem [ref=f31e319]: Kw
    - list [ref=f31e320]:
      - listitem [ref=f31e321]: "Marka: Arabanızın markasıdır. Bu bölüme hangi araç markasına sahipseniz onu seçin."
      - listitem [ref=f31e322]: "Model: Arabanıza ait markanın modelidir. Model seçerek devam edin."
      - listitem [ref=f31e323]: "Kasa: Arabanızın kasa durumudur. Örneğin: sedan, hatchback, cabrio, coupe, station wagon"
      - listitem [ref=f31e324]: "Yıl: Arabanıza ait olan üretim yılıdır."
      - listitem [ref=f31e325]: "Motor: Araç kaç motor ise bu bilgiyi girin. Bilmiyorsanız arabanın arka bölümünde yazar."
      - listitem [ref=f31e326]: "Kw: Ruhsatta sağ altta yazan KW değeridir. 1 KW = 1.341 HP yani 1 KW 1.341 beygire eşittir."
    - paragraph [ref=f31e327]: Bu işlemleri yaptıktan sonra arabanız sistemimizde gözükür olmaktadır. Bundan sonraki aşamada satın almak istediğiniz ürün için uygun kategoriyi seçerek devam edin.
    - heading "Pratik Bakım Robotu" [level=4] [ref=f31e328]
    - paragraph [ref=f31e329]: "10 bin bakımı için geliştirdiğimiz bu sistem sayesinde hızlı bir şekilde arabanıza uyumlu bakım parçalarına ulaşabilirsiniz. 10 bin bakımı için şu parçalar listelenmektedir:"
    - list [ref=f31e330]:
      - listitem [ref=f31e331]: Hava filtresi
      - listitem [ref=f31e332]: Yağ filtresi
      - listitem [ref=f31e333]: Polen filtresi
      - listitem [ref=f31e334]: Yakıt filtresi
    - paragraph [ref=f31e335]: Bunun haricinde ön ve arka balata da listelenmektedir. Yedek parça fiyatları ve modelleri için lütfen bizimle iletişime geçin.
