      - paragraph [ref=f9e124]:
        - strong [ref=f9e125]: Bakım robotu hizmetinizde...
        - text: Araç bilgilerinizi girerek sistem üzerinden aracınızı bulmak ve seçmekle başlar. Bilindiği üzere her araç belli bir kilometre ya da kullanım süresine ulaştıktan sonra hava, yağ, yakıt ve polen filtreleri ile birlikte motor yağının da değiştirilmesi gerekir. 10.000 bakım olarak da bilinen bu süreç aslında periyodik ya da dönemsel araç bakımıdır ve araç motorunun ömrünü otomatik olarak uzatarak motorun sorunsuz çalışmasını sağlar. Filtre ve motor yağı değişimini ister profesyonel yardım alalım isterse kendimiz yapalım, aramıza ait doğru filtrelerin ve uygun motor yağlarının seçimini ayrı ayrı yaparak zaman kaybetmeden tek seferde periyodik bakım yedek parçalarının bulunması araç sahiplerine ciddi kolaylıklar sağlar.
      - separator [ref=f9e126]
      - paragraph [ref=f9e127]:
        - strong [ref=f9e128]: Bakım robotu nasıl kullanılır ?
        - text: Çok basit bir süreçtir. Bunun için yapmanız gereken en önemli adım aracınızı araç seçim alanından seçmektir. Aracınızı bulduktan sonra sistem otomatik olarak sizi aracınıza özel hazırlanmış ekrana yönlendirecektir. İstediğiniz ürünleri özel olarak kategorize edilmiş ekrandan seçebilirsiniz.
